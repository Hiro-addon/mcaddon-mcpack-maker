<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MC Pack Builder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{box-sizing:border-box;}
body{
margin:0;
background:#111;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.container{
max-width:700px;
margin:auto;
padding:24px 16px 50px;
}
h1{
margin:0;
font-size:28px;
}
.subtitle{
margin:6px 0 28px;
color:#888;
}
.section{
background:#1a1a1a;
border:1px solid #292929;
border-radius:14px;
padding:18px;
margin-bottom:16px;
}
.section h2{
margin:0 0 16px;
font-size:18px;
}
.upload{
border:1px dashed #444;
border-radius:12px;
padding:20px;
text-align:center;
background:#111;
}
.upload input{
display:none;
}
.upload-button{
display:inline-block;
padding:12px 18px;
border-radius:9px;
background:#fff;
color:#111;
font-weight:bold;
cursor:pointer;
}
.file-name{
margin-top:12px;
color:#888;
font-size:13px;
word-break:break-all;
}
.generate{
width:100%;
padding:14px;
border:0;
border-radius:10px;
background:#fff;
color:#111;
font-size:16px;
font-weight:bold;
cursor:pointer;
}
.generate:disabled{
opacity:.4;
cursor:not-allowed;
}
.status{
margin-top:16px;
background:#0d0d0d;
border:1px solid #292929;
border-radius:12px;
padding:15px;
font-size:14px;
line-height:1.7;
}
.success{
color:#fff;
}
.error{
color:#ff7777;
}
</style>
</head>

<body>

<div class="container">

<h1>MC Pack Builder</h1>
<div class="subtitle">Minecraft Bedrock Pack Generator</div>

<div class="section">

<h2>ZIPファイル</h2>

<div class="upload">

<label class="upload-button" for="packFile">
ZIPを選択
</label>

<input id="packFile" type="file" accept=".zip,application/zip">

<div class="file-name" id="packName">
未選択
</div>

</div>

</div>

<div class="section">

<button class="generate" id="generate" disabled>
パックを生成
</button>

</div>

<div class="status" id="status">
ZIPを選択してください。
</div>

</div>

<script>

const packFile=document.getElementById("packFile");
const packName=document.getElementById("packName");
const generate=document.getElementById("generate");
const status=document.getElementById("status");

packFile.onchange=()=>{
  packName.textContent=packFile.files.length?packFile.files[0].name:"未選択";
  generate.disabled=!packFile.files.length;
};

function setStatus(text,type=""){
  status.className="status "+type;
  status.innerHTML=text;
}

function isUnwanted(path){
  const parts=path.split("/").filter(Boolean);

  for(const part of parts){
    if(
      part==="__MACOSX" ||
      part===".DS_Store" ||
      part.startsWith("._") ||
      part.startsWith("__")
    ){
      return true;
    }
  }

  return false;
}

function normalizePath(path){
  return path
    .replace(/\\/g,"/")
    .split("/")
    .filter(Boolean)
    .join("/");
}

async function findManifestRoot(zip){

  const manifests=[];

  zip.forEach((path,entry)=>{
    const clean=normalizePath(path);

    if(
      !entry.dir &&
      !isUnwanted(clean) &&
      clean.toLowerCase().endsWith("manifest.json")
    ){
      manifests.push({
        path:clean,
        entry:entry
      });
    }
  });

  if(!manifests.length){
    throw new Error("manifest.jsonが見つかりません。");
  }

  if(manifests.length>1){
    throw new Error("manifest.jsonが複数見つかりました。");
  }

  const manifestPath=manifests[0].path;

  const root=manifestPath.substring(
    0,
    manifestPath.lastIndexOf("/")
  );

  return root;
}

async function readPack(file){

  const zip=await JSZip.loadAsync(file);

  const root=await findManifestRoot(zip);

  const output={};

  zip.forEach((path,entry)=>{

    const clean=normalizePath(path);

    if(!clean){
      return;
    }

    if(isUnwanted(clean)){
      return;
    }

    let relative="";

    if(root){

      const prefix=root+"/";

      if(!clean.startsWith(prefix)){
        return;
      }

      relative=clean.substring(prefix.length);

    }else{

      relative=clean;

    }

    if(!relative){
      return;
    }

    if(
      relative.startsWith("__") ||
      relative.startsWith("._")
    ){
      return;
    }

    output[relative]=entry;

  });

  if(!output["manifest.json"]){
    throw new Error(
      "manifest.jsonをパックのルートに配置できませんでした。"
    );
  }

  const manifest=await getManifest(output);

  if(!manifest){
    throw new Error(
      "manifest.jsonの読み込みに失敗しました。"
    );
  }

  const type=detectPackType(manifest);

  return {
    files:output,
    manifest:manifest,
    type:type
  };
}

function detectPackType(manifest){

  if(!Array.isArray(manifest.modules)){
    throw new Error(
      "manifest.jsonにmodulesがありません。"
    );
  }

  const types=manifest.modules
    .map(module=>module.type)
    .filter(Boolean)
    .map(type=>String(type).toLowerCase());

  if(types.includes("resources")){
    return "RP";
  }

  if(types.includes("data")){
    return "BP";
  }

  throw new Error(
    "manifest.jsonからRP/BPを判定できません。modules[].typeにresourcesまたはdataが必要です。"
  );
}

async function getManifest(pack){

  if(!pack["manifest.json"]){
    return null;
  }

  try{

    const text=
      await pack["manifest.json"].async("string");

    return JSON.parse(text);

  }catch{

    return null;

  }

}

async function addPackToZip(target,pack){

  for(const path in pack){

    const entry=pack[path];

    if(entry.dir){
      target.folder(path);
      continue;
    }

    const data=
      await entry.async("uint8array");

    target.file(path,data);
  }

}

function getPackName(manifest,fallback){

  if(
    manifest &&
    manifest.header &&
    typeof manifest.header.name==="string" &&
    manifest.header.name.trim()
  ){

    return manifest.header.name.trim();

  }

  return fallback;
}

function safeFileName(name){

  return name
    .replace(/[\\/:*?"<>|]/g,"")
    .replace(/\s+/g," ")
    .trim()
    .replace(/\.+$/,"") ||
    "Addon";

}

async function createMcpack(pack){

  const zip=new JSZip();

  await addPackToZip(
    zip,
    pack.files
  );

  const fallback=
    pack.type==="RP"
      ?"ResourcePack"
      :"BehaviorPack";

  const name=safeFileName(
    getPackName(
      pack.manifest,
      fallback
    )
  );

  const blob=
    await zip.generateAsync({
      type:"blob",
      compression:"DEFLATE",
      compressionOptions:{
        level:9
      }
    });

  download(
    blob,
    name+".mcpack"
  );

  return name+".mcpack";

}

async function createMcaddon(rp,bp){

  const zip=new JSZip();

  const rpFolder=zip.folder("RP");
  const bpFolder=zip.folder("BP");

  await addPackToZip(
    rpFolder,
    rp.files
  );

  await addPackToZip(
    bpFolder,
    bp.files
  );

  let name="Addon";

  if(
    bp.manifest &&
    bp.manifest.header &&
    typeof bp.manifest.header.name==="string" &&
    bp.manifest.header.name.trim()
  ){

    name=bp.manifest.header.name.trim();

  }else if(
    rp.manifest &&
    rp.manifest.header &&
    typeof rp.manifest.header.name==="string" &&
    rp.manifest.header.name.trim()
  ){

    name=rp.manifest.header.name.trim();

  }

  name=safeFileName(name);

  const blob=
    await zip.generateAsync({
      type:"blob",
      compression:"DEFLATE",
      compressionOptions:{
        level:9
      }
    });

  download(
    blob,
    name+".mcaddon"
  );

  return name+".mcaddon";

}

function download(blob,name){

  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement("a");

  a.href=url;
  a.download=name;

  document.body.appendChild(a);

  a.click();

  a.remove();

  setTimeout(()=>{
    URL.revokeObjectURL(url);
  },1000);

}

generate.onclick=async()=>{

  generate.disabled=true;

  try{

    setStatus(
      "ZIPを解析しています..."
    );

    const pack=
      await readPack(
        packFile.files[0]
      );

    if(pack.type==="RP"){

      setStatus(
        "manifest.jsonを確認しました。<br><br>"+
        "種類：リソースパック<br>"+
        "mcpackを生成しています..."
      );

      const fileName=
        await createMcpack(pack);

      setStatus(
        "✓ mcpackを生成しました<br><br>"+
        "<strong>"+fileName+"</strong><br><br>"+
        "種類：リソースパック",
        "success"
      );

    }else{

      setStatus(
        "manifest.jsonを確認しました。<br><br>"+
        "種類：ビヘイビアパック<br>"+
        "mcpackを生成しています..."
      );

      const fileName=
        await createMcpack(pack);

      setStatus(
        "✓ mcpackを生成しました<br><br>"+
        "<strong>"+fileName+"</strong><br><br>"+
        "種類：ビヘイビアパック",
        "success"
      );

    }

  }catch(error){

    setStatus(
      "✕ "+error.message,
      "error"
    );

  }finally{

    generate.disabled=false;

  }

};

</script>

</body>
</html>

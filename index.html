<style>
*{box-sizing:border-box;}
body{
margin:0;
background:#111;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.app-header{
height:78px;
background:#fff;
color:#111;
display:flex;
align-items:center;
justify-content:center;

}
.app-header-title{
font-size:21px;
font-weight:700;
letter-spacing:.2px;
}
.app-menu-wrap{
position:absolute;
left:0;
top:8px;
}
.app-menu-button{
width:58px;
height:62px;
border:0;
background:transparent;
color:#111;
cursor:pointer;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:2px;
}
.app-menu-icon{
font-size:31px;
line-height:29px;
font-weight:500;
}
.app-menu-label{
font-size:12px;
line-height:16px;
}
.container{
max-width:900px;
margin:auto;
padding:24px 16px 50px;
}
.page{
display:none;
}
.page.active{
display:block;
}
.header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:28px;
}
.header-left{
display:flex;
align-items:center;
gap:12px;
}
.back{
width:42px;
height:42px;
border:1px solid #292929;
border-radius:10px;
background:#1a1a1a;
color:#fff;
font-size:22px;
cursor:pointer;
}
.menu-wrap{
position:relative;
}
.menu{
position:absolute;
left:0;
top:70px;
width:220px;
background:#1a1a1a;
border:1px solid #333;
border-radius:12px;
padding:6px;
z-index:100;
box-shadow:0 10px 30px #0008;
display:none;
}
.menu.active{
display:block;
}
.menu button{
width:100%;
padding:12px;
border:0;
border-radius:8px;
background:transparent;
color:#fff;
text-align:left;
font-size:14px;
cursor:pointer;
}
.menu button:hover{
background:#292929;
}
h1{
margin:0;
font-size:28px;
}
.subtitle{
margin:6px 0 28px;
color:#888;
}
.home-title{
margin-bottom:8px;
}
.home-subtitle{
margin-bottom:28px;
}
.section{
background:#1a1a1a;
border:1px solid #292929;
border-radius:14px;
padding:18px;
margin-bottom:16px;
}
.section h2{
margin:0 0 16px;
font-size:18px;
}
.tool-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}
.tool-card{
padding:20px;
border:1px solid #333;
border-radius:12px;
background:#111;
color:#fff;
text-align:left;
cursor:pointer;
}
.tool-card:hover{
background:#1c1c1c;
}
.tool-icon{
font-size:28px;
margin-bottom:12px;
}
.tool-name{
font-size:17px;
font-weight:bold;
}
.tool-description{
margin-top:6px;
color:#888;
font-size:13px;
line-height:1.5;
}
label{
display:block;
margin-bottom:7px;
color:#bbb;
font-size:14px;
}
input{
width:100%;
padding:12px 14px;
border-radius:9px;
border:1px solid #333;
background:#111;
color:#fff;
outline:none;
font-size:15px;
}
input:focus{
border-color:#666;
}
input::placeholder{
color:#777;
opacity:.55;
}
.field{
margin-bottom:15px;
}
.field:last-child{
margin-bottom:0;
}
.choice{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}
.choice button,
.script-choice button{
padding:13px 10px;
border:1px solid #333;
border-radius:10px;
background:#111;
color:#aaa;
cursor:pointer;
font-size:14px;
}
.choice button.active,
.script-choice button.active{
background:#fff;
color:#111;
border-color:#fff;
}
.script-choice{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-bottom:16px;
}
.generate{
width:100%;
padding:14px;
border:0;
border-radius:10px;
background:#fff;
color:#111;
font-size:16px;
font-weight:bold;
cursor:pointer;
}
.generate:disabled{
opacity:.4;
cursor:not-allowed;
}
.result{
margin-top:16px;
}
.result-box{
background:#0d0d0d;
border:1px solid #292929;
border-radius:12px;
overflow:hidden;
margin-bottom:16px;
}
.result-title{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 14px;
border-bottom:1px solid #292929;
font-weight:bold;
}
.copy-btn{
padding:7px 12px;
border:1px solid #444;
border-radius:7px;
background:#1a1a1a;
color:#fff;
cursor:pointer;
font-size:12px;
}
.copy-btn:hover{
background:#252525;
}
pre{
margin:0;
padding:15px;
overflow-x:auto;
white-space:pre-wrap;
word-break:break-word;
color:#ddd;
font-size:13px;
line-height:1.6;
}
.hidden{
display:none;
}
.upload{
border:1px dashed #444;
border-radius:12px;
padding:20px;
text-align:center;
background:#111;
}
.upload input{
display:none;
}
.upload-button{
display:inline-block;
padding:12px 18px;
border-radius:9px;
background:#fff;
color:#111;
font-weight:bold;
cursor:pointer;
}
.delete-button{
display:inline-block;
margin-left:8px;
padding:12px 18px;
border-radius:9px;
background:#292929;
color:#fff;
font-weight:bold;
cursor:pointer;
border:0;
}
.file-name{
margin-top:12px;
color:#888;
font-size:13px;
word-break:break-all;
}
.status{
margin-top:16px;
background:#0d0d0d;
border:1px solid #292929;
border-radius:12px;
padding:15px;
font-size:14px;
line-height:1.7;
}
.success{
color:#fff;
}
.error{
color:#ff7777;
}
.page-loader{
position:fixed;
inset:0;
background:#111;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
opacity:0;
visibility:hidden;
transition:opacity .12s ease;
}
.page-loader.active{
opacity:1;
visibility:visible;
}
.loader-spinner{
width:42px;
height:42px;
border:4px solid #292929;
border-top-color:#fff;
border-radius:50%;
animation:loader-spin .65s linear infinite;
}
@keyframes loader-spin{
to{
transform:rotate(360deg);
}
}
@media(max-width:650px){
.tool-grid{
grid-template-columns:1fr;
}
.choice{
grid-template-columns:1fr;
}
.script-choice{
grid-template-columns:1fr;
}
h1{
font-size:24px;
}
.app-header-title{
font-size:19px;
}
}
</style>

<script>
const menuButton=document.getElementById("menuButton");
const menu=document.getElementById("menu");
const pageLoader=document.getElementById("pageLoader");

menuButton.onclick=()=>{
menu.classList.toggle("active");
};

let pageLoading=false;

function resetPageData(page){
if(page==="manifest"){
document.getElementById("name").value="";
document.getElementById("description").value="";
document.getElementById("version").value="";
document.getElementById("engine").value="";
document.getElementById("entry").value="";
document.getElementById("serverVersion").value="";
document.getElementById("uiVersion").value="";
document.getElementById("uiCheck").checked=false;
document.getElementById("result").innerHTML="";
packType="bp";
useScript=false;
bpBtn.classList.add("active");
rpBtn.classList.remove("active");
bothBtn.classList.remove("active");
scriptOffBtn.classList.add("active");
scriptOnBtn.classList.remove("active");
scriptSettings.classList.add("hidden");
scriptSection.classList.remove("hidden");
uiVersionField.classList.add("hidden");
}

if(page==="pack"){
rpFile.value="";
bpFile.value="";
rpName.textContent="未選択";
bpName.textContent="未選択";
status.className="status";
status.innerHTML=
"RPまたはBPのZIPを選択してください。";
updateButton();
}
}

function openPage(page){
if(pageLoading){
return;
}

const current=document.querySelector(".page.active");

if(current && current.id===page){
menu.classList.remove("active");
return;
}

if(current){
resetPageData(current.id);
}

pageLoading=true;
menu.classList.remove("active");
pageLoader.classList.add("active");

setTimeout(()=>{
document.querySelectorAll(".page").forEach(p=>{
p.classList.remove("active");
});

document.getElementById(page).classList.add("active");

window.scrollTo({
top:0,
behavior:"instant"
});

setTimeout(()=>{
pageLoader.classList.remove("active");

setTimeout(()=>{
pageLoading=false;
},120);

},300);

},120);
}

document.addEventListener("click",e=>{
if(!e.target.closest(".menu-wrap")){
menu.classList.remove("active");
}
});

let packType="bp";
let useScript=false;

const bpBtn=document.getElementById("bpBtn");
const rpBtn=document.getElementById("rpBtn");
const bothBtn=document.getElementById("bothBtn");

const scriptSection=
document.getElementById("scriptSection");

const scriptOffBtn=
document.getElementById("scriptOffBtn");

const scriptOnBtn=
document.getElementById("scriptOnBtn");

const scriptSettings=
document.getElementById("scriptSettings");

const uiCheck=
document.getElementById("uiCheck");

const uiVersionField=
document.getElementById("uiVersionField");

function setPackType(type){
packType=type;

bpBtn.classList.toggle(
"active",
type==="bp"
);

rpBtn.classList.toggle(
"active",
type==="rp"
);

bothBtn.classList.toggle(
"active",
type==="both"
);

if(type==="rp"){
scriptSection.classList.add("hidden");
useScript=false;
scriptOffBtn.classList.add("active");
scriptOnBtn.classList.remove("active");
scriptSettings.classList.add("hidden");
}else{
scriptSection.classList.remove("hidden");
}
}

bpBtn.onclick=()=>{
setPackType("bp");
};

rpBtn.onclick=()=>{
setPackType("rp");
};

bothBtn.onclick=()=>{
setPackType("both");
};

scriptOffBtn.onclick=()=>{
useScript=false;
scriptOffBtn.classList.add("active");
scriptOnBtn.classList.remove("active");
scriptSettings.classList.add("hidden");
};

scriptOnBtn.onclick=()=>{
useScript=true;
scriptOffBtn.classList.remove("active");
scriptOnBtn.classList.add("active");
scriptSettings.classList.remove("hidden");
};

uiCheck.onchange=()=>{
uiVersionField.classList.toggle(
"hidden",
!uiCheck.checked
);
};

function getValue(id,defaultValue){
const value=
document.getElementById(id)
.value
.trim();

return value||defaultValue;
}

function getVersion(id,defaultValue){
const input=
document.getElementById(id);

const value=
input.value.trim();

if(!value){
return defaultValue;
}

if(!/^[0-9]+(\.[0-9]+)*$/.test(value)){
input.value="";
return defaultValue;
}

return value;
}

function getScriptVersion(id,defaultValue){
const input=
document.getElementById(id);

const value=
input.value.trim();

if(!value){
return defaultValue;
}

if(value==="beta"){
return value;
}

if(
!/^[0-9]+(\.[0-9]+)*(?:-(?:beta|rc)(?:\.[0-9A-Za-z]+)*)?$/.test(value)
){
input.value="";
return defaultValue;
}

return value;
}

function versionArray(value){
return value
.split(".")
.map(v=>{
const n=parseInt(v,10);
return Number.isNaN(n)?0:n;
});
}

function getEntry(){
let entry=
document.getElementById("entry")
.value
.trim();

if(!entry){
return "main.js";
}

if(!entry.endsWith(".js")){
entry+=".js";
}

return entry;
}

function uuid(){
return crypto.randomUUID();
}

function createBehaviorManifest(
name,
description,
version,
engine,
bpUuid,
rpUuid
){
const bpModuleUuid=uuid();

const manifest={
format_version:2,
header:{
name:name,
description:description,
uuid:bpUuid,
version:versionArray(version),
min_engine_version:versionArray(engine)
},
modules:[
{
description:description,
type:"data",
uuid:bpModuleUuid,
version:versionArray(version)
}
]
};

if(useScript){
const scriptUuid=uuid();

manifest.modules.push({
description:"Script",
type:"script",
language:"javascript",
uuid:scriptUuid,
version:versionArray(version),
entry:getEntry()
});

manifest.dependencies=[
{
module_name:"@minecraft/server",
version:getScriptVersion(
"serverVersion",
"2.7.0"
)
}
];

if(uiCheck.checked){
manifest.dependencies.push({
module_name:"@minecraft/server-ui",
version:getScriptVersion(
"uiVersion",
"1.1.0"
)
});
}
}

if(rpUuid){
if(!manifest.dependencies){
manifest.dependencies=[];
}

manifest.dependencies.unshift({
uuid:rpUuid,
version:versionArray(version)
});
}

return manifest;
}

function createResourceManifest(
name,
description,
version,
engine,
rpUuid,
bpUuid
){
const rpModuleUuid=uuid();

const manifest={
format_version:2,
header:{
name:name,
description:description,
uuid:rpUuid,
version:versionArray(version),
min_engine_version:versionArray(engine)
},
modules:[
{
description:"Resources",
type:"resources",
uuid:rpModuleUuid,
version:versionArray(version)
}
]
};

if(bpUuid){
manifest.dependencies=[
{
uuid:bpUuid,
version:versionArray(version)
}
];
}

return manifest;
}

function createResult(title,data){
const box=
document.createElement("div");

box.className="result-box";

const titleBar=
document.createElement("div");

titleBar.className="result-title";

const titleText=
document.createElement("span");

titleText.textContent=title;

const copy=
document.createElement("button");

copy.className="copy-btn";
copy.textContent="コピー";

const pre=
document.createElement("pre");

const text=
JSON.stringify(
data,
null,
2
);

pre.textContent=text;

copy.onclick=async()=>{
await navigator.clipboard.writeText(text);

copy.textContent="コピーしました";

setTimeout(()=>{
copy.textContent="コピー";
},1500);
};

titleBar.appendChild(titleText);
titleBar.appendChild(copy);

box.appendChild(titleBar);
box.appendChild(pre);

return box;
}

document.getElementById(
"generateManifest"
).onclick=()=>{

const name=
getValue(
"name",
"アドオン名"
);

const description=
getValue(
"description",
"アドオン説明文"
);

const version=
getVersion(
"version",
"1.0.0"
);

const engine=
getVersion(
"engine",
"1.20.0"
);

const result=
document.getElementById("result");

result.innerHTML="";

if(packType==="bp"){

const bpUuid=uuid();

const bp=
createBehaviorManifest(
name,
description,
version,
engine,
bpUuid,
null
);

result.appendChild(
createResult(
"ビヘイビアパック",
bp
)
);

}

if(packType==="rp"){

const rpUuid=uuid();

const rp=
createResourceManifest(
name,
description,
version,
engine,
rpUuid,
null
);

result.appendChild(
createResult(
"リソースパック",
rp
)
);

}

if(packType==="both"){

const bpUuid=uuid();
const rpUuid=uuid();

const bp=
createBehaviorManifest(
name,
description,
version,
engine,
bpUuid,
rpUuid
);

const rp=
createResourceManifest(
name,
description,
version,
engine,
rpUuid,
bpUuid
);

result.appendChild(
createResult(
"ビヘイビアパック",
bp
)
);

result.appendChild(
createResult(
"リソースパック",
rp
)
);

}
};

const rpFile=
document.getElementById("rpFile");

const bpFile=
document.getElementById("bpFile");

const rpName=
document.getElementById("rpName");

const bpName=
document.getElementById("bpName");

const rpDelete=
document.getElementById("rpDelete");

const bpDelete=
document.getElementById("bpDelete");

const generatePack=
document.getElementById("generatePack");

const status=
document.getElementById("status");

rpFile.onchange=()=>{
rpName.textContent=
rpFile.files.length
?rpFile.files[0].name
:"未選択";

updateButton();
};

bpFile.onchange=()=>{
bpName.textContent=
bpFile.files.length
?bpFile.files[0].name
:"未選択";

updateButton();
};

rpDelete.onclick=()=>{
rpFile.value="";
rpName.textContent="未選択";
updateButton();
};

bpDelete.onclick=()=>{
bpFile.value="";
bpName.textContent="未選択";
updateButton();
};

function updateButton(){
generatePack.disabled=
!rpFile.files.length &&
!bpFile.files.length;
}

function setStatus(text,type=""){
status.className="status "+type;
status.innerHTML=text;
}

function isUnwanted(path){
const parts=
path.split("/")
.filter(Boolean);

for(const part of parts){

if(
part==="__MACOSX" ||
part===".DS_Store" ||
part.startsWith("._") ||
part.startsWith("__")
){
return true;
}

}

return false;
}

function normalizePath(path){
return path
.replace(/\\/g,"/")
.split("/")
.filter(Boolean)
.join("/");
}

async function findManifestRoot(zip){

const manifests=[];

zip.forEach((path,entry)=>{

const clean=
normalizePath(path);

if(
!entry.dir &&
!isUnwanted(clean) &&
clean.toLowerCase().endsWith("manifest.json")
){

manifests.push({
path:clean,
entry:entry
});

}

});

if(!manifests.length){
throw new Error(
"manifest.jsonが見つかりません。"
);
}

if(manifests.length>1){
throw new Error(
"manifest.jsonが複数見つかりました。"
);
}

const manifestPath=
manifests[0].path;

const root=
manifestPath.substring(
0,
manifestPath.lastIndexOf("/")
);

return root;
}

async function readPack(file,type){

const zip=
await JSZip.loadAsync(file);

const root=
await findManifestRoot(zip);

const output={};

zip.forEach((path,entry)=>{

const clean=
normalizePath(path);

if(!clean){
return;
}

if(isUnwanted(clean)){
return;
}

let relative="";

if(root){

if(clean===root){
return;
}

const prefix=
root+"/";

if(!clean.startsWith(prefix)){
return;
}

relative=
clean.substring(
prefix.length
);

}else{

relative=clean;

}

if(!relative){
return;
}

if(relative.startsWith("__")){
return;
}

if(relative.startsWith("._")){
return;
}

output[relative]=entry;

});

if(!output["manifest.json"]){
throw new Error(
type+
"のmanifest.jsonを正しく検出できませんでした。"
);
}

const manifest=
await getManifest(output);

if(!manifest){
throw new Error(
type+
"のmanifest.jsonを読み込めません。"
);
}

if(!Array.isArray(manifest.modules)){
throw new Error(
type+
"のmanifest.jsonにmodulesがありません。"
);
}

const moduleTypes=
manifest.modules
.map(module=>module.type)
.filter(Boolean);

let detectedType=null;

if(moduleTypes.includes("resources")){
detectedType="RP";
}else if(moduleTypes.includes("data")){
detectedType="BP";
}

if(!detectedType){
throw new Error(
type+
"のmanifest.jsonからRP/BPを判定できません。"
);
}

if(detectedType!==type){

throw new Error(
type+
"として選択されていますが、manifest.jsonは"+
(
detectedType==="RP"
?"リソースパック"
:"ビヘイビアパック"
)+
"です。"
);

}

return output;
}

async function addPackToZip(target,pack){

for(const path in pack){

const entry=pack[path];

if(entry.dir){
target.folder(path);
continue;
}

const data=
await entry.async("uint8array");

target.file(
path,
data
);

}

}

async function getManifest(pack){

if(!pack["manifest.json"]){
return null;
}

try{

const text=
await pack["manifest.json"]
.async("string");

return JSON.parse(text);

}catch{

return null;

}

}

function getPackName(manifest,fallback){

if(
manifest &&
manifest.header &&
typeof manifest.header.name==="string" &&
manifest.header.name.trim()
){

return manifest.header.name.trim();

}

return fallback;
}

function safeFileName(name){

return name
.replace(/[\\/:*?"<>|]/g,"")
.replace(/\s+/g," ")
.trim()
.replace(/\.+$/,"")
||"Addon";

}

async function createMcpack(pack,type){

const manifest=
await getManifest(pack);

const zip=
new JSZip();

await addPackToZip(
zip,
pack
);

const fallback=
type==="RP"
?"ResourcePack"
:"BehaviorPack";

const name=
safeFileName(
getPackName(
manifest,
fallback
)
);

const blob=
await zip.generateAsync({
type:"blob",
compression:"DEFLATE",
compressionOptions:{
level:9
}
});

download(
blob,
name+".mcpack"
);

return name+".mcpack";
}

async function createMcaddon(rp,bp){

const zip=
new JSZip();

const rpFolder=
zip.folder("RP");

const bpFolder=
zip.folder("BP");

await addPackToZip(
rpFolder,
rp
);

await addPackToZip(
bpFolder,
bp
);

let name="Addon";

name=
safeFileName(name);

const blob=
await zip.generateAsync({
type:"blob",
compression:"DEFLATE",
compressionOptions:{
level:9
}
});

download(
blob,
name+".mcaddon"
);

return name+".mcaddon";
}

function download(blob,name){

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;
a.download=name;

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(()=>{
URL.revokeObjectURL(url);
},1000);

}

generatePack.onclick=async()=>{

generatePack.disabled=true;

try{

const hasRP=
rpFile.files.length>0;

const hasBP=
bpFile.files.length>0;

if(!hasRP&&!hasBP){

throw new Error(
"ZIPを1つ以上選択してください。"
);

}

setStatus(
"ZIPを読み込んでいます..."
);

let rp=null;
let bp=null;

const missing=[];

if(hasBP){

setStatus(
"BP ZIPを解析しています..."
);

try{

bp=
await readPack(
bpFile.files[0],
"BP"
);

}catch(error){

if(
error.message===
"manifest.jsonが見つかりません。"
){

missing.push("BP");

}else{

throw error;

}

}

}

if(hasRP){

setStatus(
"RP ZIPを解析しています..."
);

try{

rp=
await readPack(
rpFile.files[0],
"RP"
);

}catch(error){

if(
error.message===
"manifest.jsonが見つかりません。"
){

missing.push("RP");

}else{

throw error;

}

}

}

if(missing.length){

throw new Error(
missing.join(",")+
"のmanifestが見つかりません。"
);

}

if(hasRP&&hasBP){

setStatus(
"RPとBPを整理してmcaddonを生成しています..."
);

const fileName=
await createMcaddon(
rp,
bp
);

setStatus(
"✓ mcaddonを生成しました<br><br>"+
"<strong>"+fileName+"</strong><br><br>"+
"中身：<br>"+
"RP/<br>"+
"BP/",
"success"
);

}else if(hasRP){

setStatus(
"RPを整理してmcpackを生成しています..."
);

const fileName=
await createMcpack(
rp,
"RP"
);

setStatus(
"✓ mcpackを生成しました<br><br>"+
"<strong>"+fileName+"</strong>",
"success"
);

}else{

setStatus(
"BPを整理してmcpackを生成しています..."
);

const fileName=
await createMcpack(
bp,
"BP"
);

setStatus(
"✓ mcpackを生成しました<br><br>"+
"<strong>"+fileName+"</strong>",
"success"
);

}

}catch(error){

setStatus(
"✕ "+error.message,
"error"
);

}finally{

generatePack.disabled=false;

}

};

updateButton();
</script>
</body>
</html>

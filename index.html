<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MC Pack Builder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{box-sizing:border-box;}
body{
margin:0;
background:#111;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.container{
max-width:700px;
margin:auto;
padding:24px 16px 50px;
}
h1{
margin:0;
font-size:28px;
}
.subtitle{
margin:6px 0 28px;
color:#888;
}
.section{
background:#1a1a1a;
border:1px solid #292929;
border-radius:14px;
padding:18px;
margin-bottom:16px;
}
.section h2{
margin:0 0 16px;
font-size:18px;
}
.upload{
border:1px dashed #444;
border-radius:12px;
padding:20px;
text-align:center;
background:#111;
}
.upload input{
display:none;
}
.upload-button{
display:inline-block;
padding:12px 18px;
border-radius:9px;
background:#fff;
color:#111;
font-weight:bold;
cursor:pointer;
}
.delete-button{
display:inline-block;
margin-left:8px;
padding:12px 18px;
border-radius:9px;
background:#292929;
color:#fff;
font-weight:bold;
cursor:pointer;
border:0;
}
.file-name{
margin-top:12px;
color:#888;
font-size:13px;
word-break:break-all;
}
.generate{
width:100%;
padding:14px;
border:0;
border-radius:10px;
background:#fff;
color:#111;
font-size:16px;
font-weight:bold;
cursor:pointer;
}
.generate:disabled{
opacity:.4;
cursor:not-allowed;
}
.status{
margin-top:16px;
background:#0d0d0d;
border:1px solid #292929;
border-radius:12px;
padding:15px;
font-size:14px;
line-height:1.7;
}
.success{
color:#fff;
}
.error{
color:#ff7777;
}
.progress{
height:6px;
background:#292929;
border-radius:99px;
overflow:hidden;
margin-top:12px;
}
.progress-bar{
height:100%;
width:0;
background:#fff;
transition:width .2s;
}
@media(max-width:650px){
h1{font-size:24px;}
}
</style>
</head>

<body>

<div class="container">

<h1>MC Pack Builder</h1>
<div class="subtitle">Minecraft Bedrock Pack Generator</div>

<div class="section">
<h2>リソースパック</h2>

<div class="upload">
<label class="upload-button" for="rpFile">
RP ZIPを選択
</label>

<button class="delete-button" id="rpDelete">
削除
</button>

<input id="rpFile" type="file" accept=".zip,application/zip">

<div class="file-name" id="rpName">
未選択
</div>
</div>
</div>

<div class="section">
<h2>ビヘイビアパック</h2>

<div class="upload">
<label class="upload-button" for="bpFile">
BP ZIPを選択
</label>

<button class="delete-button" id="bpDelete">
削除
</button>

<input id="bpFile" type="file" accept=".zip,application/zip">

<div class="file-name" id="bpName">
未選択
</div>
</div>
</div>

<div class="section">
<button class="generate" id="generate">
パックを生成
</button>
</div>

<div class="status" id="status">
RPまたはBPのZIPを選択してください。
</div>

</div>

<script>
const rpFile=document.getElementById("rpFile");
const bpFile=document.getElementById("bpFile");
const rpName=document.getElementById("rpName");
const bpName=document.getElementById("bpName");
const rpDelete=document.getElementById("rpDelete");
const bpDelete=document.getElementById("bpDelete");
const generate=document.getElementById("generate");
const status=document.getElementById("status");

rpFile.onchange=()=>{
  rpName.textContent=rpFile.files.length?rpFile.files[0].name:"未選択";
  updateButton();
};

bpFile.onchange=()=>{
  bpName.textContent=bpFile.files.length?bpFile.files[0].name:"未選択";
  updateButton();
};

rpDelete.onclick=()=>{
  rpFile.value="";
  rpName.textContent="未選択";
  updateButton();
};

bpDelete.onclick=()=>{
  bpFile.value="";
  bpName.textContent="未選択";
  updateButton();
};

function updateButton(){
  generate.disabled=!rpFile.files.length&&!bpFile.files.length;
}

function setStatus(text,type=""){
  status.className="status "+type;
  status.innerHTML=text;
}

function isUnwanted(path){
  const parts=path.split("/").filter(Boolean);

  for(const part of parts){
    if(
      part==="__MACOSX" ||
      part===".DS_Store" ||
      part.startsWith("._") ||
      part.startsWith("__")
    ){
      return true;
    }
  }

  return false;
}

function normalizePath(path){
  return path
    .replace(/\\/g,"/")
    .split("/")
    .filter(Boolean)
    .join("/");
}

async function findManifestRoot(zip){

  const manifests=[];

  zip.forEach((path,entry)=>{
    const clean=normalizePath(path);

    if(
      !entry.dir &&
      !isUnwanted(clean) &&
      clean.toLowerCase().endsWith("manifest.json")
    ){
      manifests.push({
        path:clean,
        entry:entry
      });
    }
  });

  if(!manifests.length){
    throw new Error("manifest.jsonが見つかりません。");
  }

  if(manifests.length>1){
    throw new Error("manifest.jsonが複数見つかりました。");
  }

  const manifestPath=manifests[0].path;
  const root=manifestPath.substring(
    0,
    manifestPath.lastIndexOf("/")
  );

  return root;
}

async function readPack(file,type){

  const zip=await JSZip.loadAsync(file);

  const root=await findManifestRoot(zip);

  const output={};

  zip.forEach((path,entry)=>{

    const clean=normalizePath(path);

    if(!clean){
      return;
    }

    if(isUnwanted(clean)){
      return;
    }

    let relative="";

    if(root){
      if(clean===root){
        return;
      }

      const prefix=root+"/";

      if(!clean.startsWith(prefix)){
        return;
      }

      relative=clean.substring(prefix.length);
    }else{
      relative=clean;
    }

    if(!relative){
      return;
    }

    if(relative.startsWith("__")){
      return;
    }

    if(relative.startsWith("._")){
      return;
    }

    output[relative]=entry;
  });

  if(!output["manifest.json"]){
    throw new Error(
      type+"のmanifest.jsonを正しく検出できませんでした。"
    );
  }

  const manifest=await getManifest(output);

  if(!manifest){
    throw new Error(
      type+"のmanifest.jsonを読み込めません。"
    );
  }

  if(!Array.isArray(manifest.modules)){
    throw new Error(
      type+"のmanifest.jsonにmodulesがありません。"
    );
  }

  const moduleTypes=manifest.modules
    .map(module=>module.type)
    .filter(Boolean);

  let detectedType=null;

  if(moduleTypes.includes("resources")){
    detectedType="RP";
  }else if(moduleTypes.includes("data")){
    detectedType="BP";
  }

  if(!detectedType){
    throw new Error(
      type+"のmanifest.jsonからRP/BPを判定できません。"
    );
  }

  if(detectedType!==type){
    throw new Error(
      type+"として選択されていますが、manifest.jsonは"+
      (detectedType==="RP"?"リソースパック":"ビヘイビアパック")+
      "です。"
    );
  }

  return output;
}

async function addPackToZip(target,pack){

  for(const path in pack){

    const entry=pack[path];

    if(entry.dir){
      target.folder(path);
      continue;
    }

    const data=await entry.async("uint8array");

    target.file(path,data);
  }
}

async function getManifest(pack){

  if(!pack["manifest.json"]){
    return null;
  }

  try{
    const text=await pack["manifest.json"].async("string");
    return JSON.parse(text);
  }catch{
    return null;
  }
}

function getPackName(manifest,fallback){

  if(
    manifest &&
    manifest.header &&
    typeof manifest.header.name==="string" &&
    manifest.header.name.trim()
  ){
    return manifest.header.name.trim();
  }

  return fallback;
}

function safeFileName(name){

  return name
    .replace(/[\\/:*?"<>|]/g,"")
    .replace(/\s+/g," ")
    .trim()
    .replace(/\.+$/,"") || "Addon";
}

async function createMcpack(pack,type){

  const manifest=await getManifest(pack);

  const zip=new JSZip();

  await addPackToZip(zip,pack);

  const fallback=type==="RP"
    ?"ResourcePack"
    :"BehaviorPack";

  const name=safeFileName(
    getPackName(manifest,fallback)
  );

  const blob=await zip.generateAsync({
    type:"blob",
    compression:"DEFLATE",
    compressionOptions:{
      level:9
    }
  });

  download(
    blob,
    name+".mcpack"
  );

  return name+".mcpack";
}

async function createMcaddon(rp,bp){

  const zip=new JSZip();

  const rpFolder=zip.folder("RP");
  const bpFolder=zip.folder("BP");

  await addPackToZip(rpFolder,rp);
  await addPackToZip(bpFolder,bp);

  const rpManifest=await getManifest(rp);
  const bpManifest=await getManifest(bp);

  let name="Addon";

  if(
    bpManifest &&
    bpManifest.header &&
    typeof bpManifest.header.name==="string" &&
    bpManifest.header.name.trim()
  ){
    name=bpManifest.header.name.trim();
  }else if(
    rpManifest &&
    rpManifest.header &&
    typeof rpManifest.header.name==="string" &&
    rpManifest.header.name.trim()
  ){
    name=rpManifest.header.name.trim();
  }

  name=safeFileName(name);

  const blob=await zip.generateAsync({
    type:"blob",
    compression:"DEFLATE",
    compressionOptions:{
      level:9
    }
  });

  download(
    blob,
    name+".mcaddon"
  );

  return name+".mcaddon";
}

function download(blob,name){

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download=name;

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>{
    URL.revokeObjectURL(url);
  },1000);
}

generate.onclick=async()=>{

  generate.disabled=true;

  try{

    const hasRP=rpFile.files.length>0;
    const hasBP=bpFile.files.length>0;

    if(!hasRP&&!hasBP){
      throw new Error("ZIPを1つ以上選択してください。");
    }

    setStatus("ZIPを読み込んでいます...");

    let rp=null;
    let bp=null;

    if(hasRP){

      setStatus(
        "RP ZIPを解析しています..."
      );

      rp=await readPack(
        rpFile.files[0],
        "RP"
      );
    }

    if(hasBP){

      setStatus(
        "BP ZIPを解析しています..."
      );

      bp=await readPack(
        bpFile.files[0],
        "BP"
      );
    }

    if(hasRP&&hasBP){

      setStatus(
        "RPとBPを整理してmcaddonを生成しています..."
      );

      const fileName=await createMcaddon(
        rp,
        bp
      );

      setStatus(
        "✓ mcaddonを生成しました<br><br>"+
        "<strong>"+fileName+"</strong><br><br>"+
        "中身：<br>"+
        "RP/<br>"+
        "BP/",
        "success"
      );

    }else if(hasRP){

      setStatus(
        "RPを整理してmcpackを生成しています..."
      );

      const fileName=await createMcpack(
        rp,
        "RP"
      );

      setStatus(
        "✓ mcpackを生成しました<br><br>"+
        "<strong>"+fileName+"</strong>",
        "success"
      );

    }else{

      setStatus(
        "BPを整理してmcpackを生成しています..."
      );

      const fileName=await createMcpack(
        bp,
        "BP"
      );

      setStatus(
        "✓ mcpackを生成しました<br><br>"+
        "<strong>"+fileName+"</strong>",
        "success"
      );
    }

  }catch(error){

    setStatus(
      "✕ "+error.message,
      "error"
    );

  }finally{

    generate.disabled=false;
  }
};

updateButton();
</script>

</body>
</html>
